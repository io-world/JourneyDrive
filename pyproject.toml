[project]
name = "journeydrive"
version = "0.4.0"
description = "Windows thin client exposing a local REST API for remote mouse/keyboard control and screenshot capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "pyperclip>=1.9.0",
    "pydantic>=2.0",
    "pynput>=1.8.2",
    "websockets>=13.0",
]

[project.optional-dependencies]
# Controller-side only (runs the MCP server, not the Windows thin client itself) —
# kept out of the base dependencies so scripts/build_windows.ps1's plain `uv sync`
# doesn't need to know the MCP SDK exists.
mcp = [
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]
# Controller-side only (runs the broker, not the Windows thin client) — same
# reasoning as the mcp extra above. fastapi/uvicorn moved here from the base
# dependencies now that the thin client no longer runs an HTTP server itself.
broker = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=13.0",
]

[project.scripts]
journeydrive = "journeydrive_windows_thinclient:main"
journeydrive-mac = "journeydrive_mac_thinclient:main"
journeydrive-mcp = "journeydrive_mcp:main"
journeydrive-broker = "journeydrive_broker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["journeydrive_windows_thinclient", "journeydrive_mac_thinclient", "journeydrive_mcp", "journeydrive_broker"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]
